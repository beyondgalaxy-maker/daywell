<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://script.google.com https://*.googleusercontent.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Daywell</title>
<meta name="description" content="A quiet task list that sorts your day.">
<meta name="theme-color" content="#F3F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daywell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="brand" href="./" aria-label="Daywell home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="bm-bg" width="32" height="32" rx="9"/><path class="bm-sun" d="M10.5 20.5a5.5 5.5 0 0 1 11 0z"/><path class="bm-line" d="M7.5 20.5h17"/></svg>
      <span>Daywell</span>
    </a>
    <nav class="views" aria-label="Views">
      <button type="button" data-act="view" data-view="today" aria-current="page">Today</button>
      <button type="button" data-act="view" data-view="calendar">Calendar</button>
      <button type="button" data-act="view" data-view="history">History</button>
    </nav>
    <div class="top-actions">
      <span class="sync-state" id="syncState" hidden></span>
      <button type="button" class="icon-btn" data-act="undo" id="undoBtn" aria-label="Undo" title="Undo (Ctrl/⌘ Z)" disabled></button>
      <button type="button" class="icon-btn" data-act="settings" aria-label="Settings" title="Settings" id="settingsBtn"></button>
    </div>
  </header>

  <main id="main">
    <section class="view view-today" id="viewToday">
      <div class="cols">
        <section class="col col-day" id="dayCol" aria-label="Day"></section>
        <section class="col col-all" id="allCol" aria-label="Everything else"></section>
      </div>
    </section>
    <section class="view view-calendar" id="viewCalendar" hidden></section>
    <section class="view view-history" id="viewHistory" hidden></section>
  </main>

  <div class="dock" id="dock">
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="timer-pill" id="timerPill" hidden></div>
    <div class="ai-panel" id="aiPanel" hidden aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="input">Add a task</label>
      <textarea id="input" rows="1" placeholder="Add a task…" enterkeyhint="send" spellcheck="true"></textarea>
      <div class="composer-row">
        <div class="chips" id="parseChips" aria-live="polite"></div>
        <div class="composer-actions">
          <button type="button" class="target-btn" id="targetBtn" data-act="target" title="Where new tasks go"></button>
          <button type="submit" class="add-btn" id="addBtn" aria-label="Add task" title="Add (Enter)"></button>
        </div>
      </div>
    </form>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button type="button" data-act="tab" data-tab="today" aria-current="page"><span class="tb-ico" data-ico="sun"></span>Today</button>
    <button type="button" data-act="tab" data-tab="all"><span class="tb-ico" data-ico="list"></span>All</button>
    <button type="button" data-act="tab" data-tab="calendar"><span class="tb-ico" data-ico="calendar"></span>Calendar</button>
    <button type="button" data-act="tab" data-tab="history"><span class="tb-ico" data-ico="history"></span>History</button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="Task details" hidden></aside>
<div class="menu" id="menu" role="menu" hidden></div>
<dialog class="settings" id="settings" aria-label="Settings"></dialog>
<dialog class="confirm" id="confirm"></dialog>
<noscript><p style="padding:24px;font-family:system-ui">Daywell needs JavaScript to run.</p></noscript>
</body>
</html>
